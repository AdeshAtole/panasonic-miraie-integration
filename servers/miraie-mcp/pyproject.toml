[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openmiraie-mcp"
version = "0.1.0"
description = "Local MCP integration for Panasonic MirAIe India"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "keyring==25.7.0", "filelock==4.2.2", "platformdirs==4.13.4"]

[project.scripts]
miraie-mcp = "miraie_mcp.server:main"

[dependency-groups]
dev = [
    "playwright",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/miraie_mcp"]
