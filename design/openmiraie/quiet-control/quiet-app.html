function dialPoint(angle,r=136){const a=angle*Math.PI/180;return [160+Math.cos(a)*r,160+Math.sin(a)*r]}

function pointerAngle(e){const r=q('#qc-dial-input').getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI}

dial.addEventListener('keydown',e=>{if(e.key==='Escape'){clearTimeout(keyboardTimer);draft=null;dragging=false;render();e.preventDefault()}});

function close(){q('#qc-overlay').hidden=true;q('.qc-main').inert=false;sheet='';if(trigger?.isConnected&&!trigger.disabled)trigger.focus()}

function option(value,label,ic,sub=''){return `<button class="qc-option cursor-interaction" role="radio" aria-checked="${selection===value}" data-choice="${value}">${ic?icon(ic):''}<span>${label}${sub?'<small>'+sub+'</small>':''}</span>${selection===value?icon('check'):''}</button>`}
function options(){let content='';if(sheet==='mode')content=Object.keys(modeIcons).map(m=>option(m,m,modeIcons[m],m==='Fan'?'Air circulation · no temperature setting':m==='Dry'?'Fan speed is managed automatically':'')).join('');if(sheet==='fan')content=['Auto','Low','Medium','High'].map(f=>option(f,f,'fan')).join('');if(sheet==='room')content=['Bedroom','Living room'].map(r=>option(r,r,'door-open')).join('');if(sheet==='vertical'||sheet==='horizontal'){const labels=sheet==='vertical'?['Swing','Position 1','Position 2','Position 3','Position 4','Position 5']:['Swing','Position 1','Position 2','Position 3','Position 4','Position 5'];content='<p class="qc-note">Positions follow this model’s controls. Exact angles aren’t verified.</p>'+labels.map((p,i)=>option(p,p,'wind',i===0?'Continuous oscillation':'')).join('')}

function route(a){
if(a==='close'){close();return}

}
root.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){selection=choice.dataset.choice;if(sheet==='mode'){route('apply-sheet');return}options();q(`[data-choice="${selection}"]`).focus();return}const b=e.target.closest('[data-action]');if(b&&!b.disabled){if(q('#qc-overlay').hidden)trigger=b;route(b.dataset.action)}else if(e.target===q('#qc-overlay'))close()});

const baseline=()=>({room:'Bedroom',temperature:24,mode:'Cool',fan:'Auto',power:true,display:true,vertical:'Swing',horizontal:'Swing',eco:false,powerful:false,capacity:0});
let app={page:'control',connected:true,acOnline:true,cleaning:false,capabilities:true,displayKnown:true,jet:false,loading:false,feedback:'',next:'match',energy:'idle',discovery:'many',authError:'',widget:'wide',widgetState:'ready',snapshots:124,epoch:0,theme:'light',large:false};

const energy=[{date:'13 Oct',day:'Tue',value:2.4},{date:'14 Oct',day:'Wed',value:2.1},{date:'15 Oct',day:'Thu',value:null},{date:'16 Oct',day:'Fri',value:2.8},{date:'17 Oct',day:'Sat',value:1.9},{date:'18 Oct',day:'Sun',value:2.6},{date:'19 Oct',day:'Mon',value:1.1}];
const ctl=q('.qc-main'),pagePane=q('#qa-page'),nav=q('#qa-nav');

  q('#qc-updated').textContent=app.loading?'Loading…':!app.connected?'Last updated 12 minutes ago':!app.acOnline?'AC offline · last updated 12 minutes ago':'Updated just now';

  let message=app.loading?'':!app.connected?notice('You’re offline. Showing the last update.','refresh'):!app.acOnline?notice('This AC is offline.','refresh'):!app.capabilities?notice('Controls couldn’t be loaded.','refresh-capabilities'):app.cleaning?notice('Cleaning is in progress. Temperature and fan are paused.'):'';
