name: Alexa display switch
on:
  push:
    paths: ['servers/alexa-display/**', '.github/workflows/alexa-display.yml']
  pull_request:
    paths: ['servers/alexa-display/**', '.github/workflows/alexa-display.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/project.py test alexa-display
      - run: python3 scripts/project.py build alexa-display
# No AWS credentials, deployment, account login or appliance commands in CI.
